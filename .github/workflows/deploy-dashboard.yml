name: Deploy Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'songbird-dashboard/**'
  workflow_dispatch: # Allow manual trigger

# Queue instead of cancel so an in-flight S3 sync always finishes; only the
# newest pending run is kept, which is the build that should end up live.
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: songbird-dashboard-163050375163
  CLOUDFRONT_DISTRIBUTION_ID: E2RCF10HZSSOIR

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: songbird-dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: songbird-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create config.json
        run: |
          cat > public/config.json << EOF
          {
            "apiUrl": "${{ secrets.API_URL }}",
            "region": "${{ secrets.AWS_REGION || 'us-east-1' }}",
            "userPoolId": "${{ secrets.USER_POOL_ID }}",
            "userPoolClientId": "${{ secrets.USER_POOL_CLIENT_ID }}",
            "mapboxToken": "${{ secrets.MAPBOX_TOKEN }}"
          }
          EOF

      - name: Build
        run: npm run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
