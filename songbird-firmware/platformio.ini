; PlatformIO Project Configuration File
;
; Songbird - Blues Sales Demo Device
; Target: Blues Cygnet (STM32L433)
; Framework: Arduino with FreeRTOS

[platformio]
src_dir = src
default_envs = blues_cygnet, cygnet_debug

[env:blues_cygnet]
platform = ststm32
board = blues_cygnet
framework = arduino
monitor_speed = 115200
upload_protocol = stlink

; Library dependencies
lib_deps =
    blues/Blues Wireless Notecard@^1.6.0
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9
    stm32duino/STM32duino FreeRTOS@^10.3.2
    sparkfun/SparkFun Qwiic Buzzer Library@^1.1.0

; Build flags
build_flags =
    ; Enable CDC for USB serial (if needed)
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

    ; Enable floating-point support in printf/snprintf (required for alert messages)
    -Wl,-u,_printf_float

    ; Product configuration
    -D PRODUCT_UID=\"com.blues.songbird\"
    -D FIRMWARE_VERSION=\"1.7.3\"
    ; Enable HAL modules
    -D HAL_TIM_MODULE_ENABLED
    -D HAL_PWR_MODULE_ENABLED
    -D HAL_PWR_EX_MODULE_ENABLED

    ; Include paths for modular structure
    -I src/audio
    -I src/notecard
    -I src/sensors
    -I src/rtos
    -I src/core
    -I src/commands

; Build in release mode by default
build_type = release

[env:cygnet_debug]
extends = env:blues_cygnet
build_type = debug
build_flags =
    ${env:blues_cygnet.build_flags}
    -D DEBUG_MODE=1
    -D CORE_DEBUG_LEVEL=5

; =============================================================================
; Songbird Rev A carrier (STM32U575CGT6) - application
; =============================================================================
; The Songbird application built for the Rev A board. -DSONGBIRD_REVA comes
; from boards/songbird_reva.json and selects the pins in SongbirdBoardRevA.h
; and the PWM audio backend. No Qwiic buzzer library and no USB CDC.
;
; The version string carries a -reva suffix on purpose: a Cygnet image must
; never be delivered to a Rev A board through Notehub DFU, or the reverse.
; Keep the two hardware types in separate Notehub fleets.
; SONGBIRD_IDLE_STOP2=1 puts the host in Stop 2 whenever every task is blocked
; (src/core/SongbirdLowPower.cpp). Set it to 0 to run the scheduler with
; ordinary idle sleep, as on Cygnet.
[env:songbird_reva]
platform = ststm32
board = songbird_reva
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<*>
lib_deps =
    blues/Blues Wireless Notecard@^1.6.0
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9
    stm32duino/STM32duino FreeRTOS@^10.3.2
build_flags =
    -Wl,-u,_printf_float
    -D PRODUCT_UID=\"com.blues.songbird\"
    -D FIRMWARE_VERSION=\"1.7.3-reva.2\"
    -D SONGBIRD_IDLE_STOP2=1
    -D HAL_TIM_MODULE_ENABLED
    -D HAL_PWR_MODULE_ENABLED
    -D HAL_PWR_EX_MODULE_ENABLED
    -I src/audio
    -I src/notecard
    -I src/sensors
    -I src/rtos
    -I src/core
    -I src/commands
build_type = release

[env:songbird_reva_debug]
extends = env:songbird_reva
build_type = debug
build_flags =
    ${env:songbird_reva.build_flags}
    -D DEBUG_MODE=1
    -D CORE_DEBUG_LEVEL=5

; =============================================================================
; Songbird Rev A carrier (STM32U575CGT6) - bring-up image
; =============================================================================
; A console-driven test image for first power-up of a Rev A board. It compiles
; only bringup/, not the application in src/. Board definition is
; boards/songbird_reva.json (STM32duino generic U575C variant, internal clocks).
; See songbird-pcb/docs/bringup/CHECKLIST.md.
[env:reva_bringup]
platform = ststm32
board = songbird_reva
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
debug_tool = stlink
build_src_filter = -<*> +<../bringup/>
lib_deps =
    blues/Blues Wireless Notecard@^1.6.0
build_flags =
    -I src/core
    -D HAL_TIM_MODULE_ENABLED

; Same tests under FreeRTOS, to prove the Cortex-M33 port before the
; application is ported.
[env:reva_bringup_rtos]
extends = env:reva_bringup
lib_deps =
    ${env:reva_bringup.lib_deps}
    stm32duino/STM32duino FreeRTOS@^10.3.2
build_flags =
    ${env:reva_bringup.build_flags}
    -D BRINGUP_RTOS

; =============================================================================
; Native Test Environment (runs on host machine)
; =============================================================================
[env:native]
platform = native
test_framework = unity
build_flags =
    -D NATIVE_TEST
    -D PRODUCT_UID=\"com.blues.songbird\"
    -D FIRMWARE_VERSION=\"1.5.3\"
    -I src/core
    -I src/commands
    -I src/sensors
    -I src/audio
    -I src/notecard
    -I src/rtos
    -I test/support
    -std=c++11
test_build_src = false
lib_deps =
